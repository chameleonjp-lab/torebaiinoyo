name: Validate and publish Game Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'push' && 'production' || format('pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    if: github.repository == 'chameleonjp-lab/torebaiinoyo'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Verify static game and social metadata offline
        run: |
          node -e 'if (Number(process.versions.node.split(".")[0]) < 22) process.exit(1)'
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const { createHash } = require('node:crypto');
          const vm = require('node:vm');
          const page = fs.readFileSync('index.html', 'utf8');
          const jpeg = fs.readFileSync('social-card.jpg');
          const canonical = 'https://chameleonjp-lab.github.io/torebaiinoyo/';
          const image = canonical + 'social-card.jpg';
          assert.ok(page.includes('<link rel="canonical" href="' + canonical + '"'));
          assert.ok(page.includes('property="og:url" content="' + canonical + '"'));
          assert.ok(page.includes('property="og:image" content="' + image + '"'));
          assert.ok(page.includes('name="twitter:image" content="' + image + '"'));
          assert.ok(page.includes('name="twitter:card" content="summary_large_image"'));
          assert.ok(/const GAME_SLUG\s*=\s*['"]toreba_iinoyo['"]/.test(page));
          assert.ok(/const GAME_URL\s*=\s*[\x22\x27]https:\/\/chameleonjp\-lab\.github\.io\/torebaiinoyo\/[\x22\x27]/.test(page));
          assert.ok(jpeg.includes(Buffer.from([255,192,0,17,8,2,118,4,176,3])));
          assert.equal(createHash('sha256').update(jpeg).digest('hex'), '35c84b4bed6e7a7a42849b91d89928d32a5c2b559b7188ba8f641c1cfed3f1bb');
          const scripts = [...page.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          assert.ok(scripts.length > 0);
          for (const [, attributes, source] of scripts) {
            assert.ok(!/\bsrc\s*=/.test(attributes), 'standalone runtime unexpectedly added a script dependency');
            if (!attributes.includes('application/json')) new vm.Script(source);
          }
          NODE
      - name: Build only the approved public runtime files
        id: package
        shell: bash
        run: |
          set -euo pipefail
          site="$(mktemp -d "$RUNNER_TEMP/game-pages.XXXXXX")"
          files=( index.html social-card.jpg )
          for file in "${files[@]}"; do
            if [[ ! -f "$file" || ! -s "$file" || -L "$file" ]]; then
              echo "Runtime file must be nonempty, regular, and not a symlink: $file" >&2
              exit 1
            fi
            install -m 0644 -- "$file" "$site/$file"
            cmp -- "$file" "$site/$file"
          done
          test "$(find "$site" -type f | wc -l)" -eq "${#files[@]}"
          printf 'path=%s\n' "$site" >> "$GITHUB_OUTPUT"
      - name: Upload only the verified Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ steps.package.outputs.path }}

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'chameleonjp-lab/torebaiinoyo'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse a stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          current="$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$current" = "$EXPECTED_SHA"
      - name: Deploy only the artifact verified from this commit
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
